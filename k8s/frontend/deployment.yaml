apiVersion: apps/v1  
kind: Deployment  
metadata:  
  name: frontend-deployment  
spec:  
  replicas: 3  
  selector:  
    matchLabels:  
      app: frontend  
  template:  
    metadata:  
      labels:  
        app: frontend  
    spec:  
      containers:  
      - name: frontend  
        image: lrunt/frontend:v1 
        imagePullPolicy: IfNotPresent 
        ports:  
        - containerPort: 5173